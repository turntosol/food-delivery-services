<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Miniver&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Food Delivery Services</title>
</head>

<body>
    <div id="sidebar-container"></div>
    <div class="main">
        <!-- Main navbar -->
        <div class="main-navbar">
            <!-- Menu when appear on mobile version -->
             <ion-icon class="menu-toggle" name="menu-outline"></ion-icon>
            <!-- Search -->
            <div class="search">
                <input
                    type="text"
                    id="search-input"
                    placeholder="What you want to eat?"
                >

                <button
                    type="button"
                    class="search-btn"
                    id="search-btn"
                >
                    Search
                </button>
            </div>
             <!-- Profile icon on left side of navbar -->
            <div class="profile">
                <a
                    href="./pages/cart/cart.html"
                    class="cart"
                >
                    <ion-icon name="cart-outline"></ion-icon>

                    <span
                        id="cart-count"
                        class="cart-count"
                    >
                        0
                    </span>
                </a>

                <a
                    href="./pages/profile/profile.html"
                    class="user"
                >
                    <ion-icon name="person-outline"></ion-icon>
                </a>
            </div>
        </div>
        <!-- Main highlight -->
        <div class="main-highlight">
            <div class="main-header">
                <h2 class="main-title">Recommendations</h2>
                <div class="main-arrow">
                    <ion-icon
                        class="back"
                        name="arrow-back-circle-outline">
                    </ion-icon>

                    <ion-icon
                        class="next"
                        name="arrow-forward-circle-outline">
                    </ion-icon>
                </div>
            </div>

            <div
                class="highlight-wrapper"
                id="recommendation-list">
            </div>
        </div>
         <!-- Main menus / order -->
          <div class="main-menus">
            <!-- Filter section -->
            <div class="main-filter">
                <div>
                    <h2 class="main-title">Menu<br>Category</h2>
                </div>
                <div class="main-arrow">
                    <ion-icon class="category-back" name="arrow-back-circle-outline"></ion-icon>
                    <ion-icon class="category-next" name="arrow-forward-circle-outline"></ion-icon>
                </div>

                <div 
                    class="filter-wrapper"
                    id="category-list"
                >
                </div>
            </div>
             <hr class="divider">
             <!-- List of food menus -->
            <div class="main-detail">

                <div class="main-header">

                    <h2 class="main-title">
                        Choose Order
                    </h2>


                    <div class="main-arrow">

                        <ion-icon
                            class="food-back"
                            name="arrow-back-circle-outline">
                        </ion-icon>


                        <ion-icon
                            class="food-next"
                            name="arrow-forward-circle-outline">
                        </ion-icon>

                    </div>

                </div>


                <div
                    class="detail-wrapper"
                    id="food-list">
                </div>

            </div>
          </div>
    </div>

</body>

    <!-- Ionicons -->
    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>

    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
        crossorigin="anonymous">
    </script>

    <!-- Application -->
    <script
        type="module"
        src="./js/components/sidebar.js">
    </script>

    <script
        type="module"
        src="./js/home/home.js">
    </script>

    <script type="module" src="./js/cart/cartBadge.js"></script>

</html>
