<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../../components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="./cart.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Miniver&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
    >

    <title>FoodTime - Cart</title>

</head>


<body>

    <div id="sidebar-container"></div>


    <div class="main">

        <!-- Navbar -->

        <div class="main-navbar">

            <ion-icon
                class="menu-toggle"
                name="menu-outline">
            </ion-icon>

            <div class="profile">
                <a
                    href="./cart.html"
                    class="cart"
                >
                    <ion-icon name="cart-outline"></ion-icon>

                    <span
                        id="cart-count"
                        class="cart-count"
                    >
                        0
                    </span>
                </a>

                <a
                    href="../../pages/profile/profile.html"
                    class="user"
                >
                    <ion-icon
                        name="person-outline">
                    </ion-icon>
                </a>

            </div>

        </div>


        <!-- Cart -->

        <div class="cart-page">

            <div class="cart-header">

                <div>

                    <h2 class="main-title">
                        My Cart
                    </h2>

                    <p class="cart-subtitle">
                        Review your order before checkout
                    </p>

                </div>

                <button
                    id="clear-cart"
                    class="clear-cart-btn"
                >
                    Clear Cart
                </button>

            </div>


            <div class="cart-content">

                <!-- Cart items -->

                <div
                    id="cart-list"
                    class="cart-list"
                >
                </div>


                <!-- Summary -->

                <div class="cart-summary">

                    <h3>
                        Order Summary
                    </h3>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="cart-subtotal">
                            $0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <span id="delivery-fee">
                            $0.00
                        </span>

                    </div>


                    <hr>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="cart-total">
                            $0.00
                        </span>

                    </div>


                    <button
                        id="checkout-btn"
                        class="checkout-btn"
                    >
                        Proceed to Checkout
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>


    <script
        type="module"
        src="../../js/components/sidebar.js">
    </script>

    <script
        type="module"
        src="../../js/cart/cart.js">
    </script>

</body>

</html>
